# Nombre de la aplicación
spring.application.name=Gestion_Aulas

# Configuración de conexión a MySQL
# (Sustituye 'gestion_aulas' por el nombre exacto de la base de datos que creaste en phpMyAdmin)
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_aulas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
# 'update' crea las tablas automáticamente si no existen o actualiza la estructura si cambia
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola de Spring las consultas SQL que se van ejecutando
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Obliga a Spring a crear primero las tablas antes de ejecutar el archivo data.sql (si lo usas)
spring.jpa.defer-datasource-initialization=true